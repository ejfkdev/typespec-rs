version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The action publishes branches for many future Rust versions, but only
      # released toolchains can be installed. Keep the CI pin aligned with
      # rust-toolchain.toml and bump it manually.
      - dependency-name: "dtolnay/rust-toolchain"
